version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/server", "/web"]
    schedule:
      interval: monthly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
